apiVersion: 1

datasources:
  - name: MQTT
    uid: mqtt-dev
    type: grafana-mqtt-datasource
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      # 'broker' is the fixture broker service defined in docker-compose.override.yaml,
      # reachable by service name on the shared Docker network.
      uri: tcp://broker:1884
